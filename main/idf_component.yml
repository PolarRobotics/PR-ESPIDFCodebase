## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  # This is NOT where we update the IDF version, that is in the Dockerfile
  # However, when you update the IDF version in the Dockerfile, you should also 
  # update this version here to match!
  idf:
    version: '==5.5.5'

  # FOLLOW LATEST ARDUINO RELEASE HERE: 
  # https://github.com/espressif/arduino-esp32/releases
  #
  # IDF version should follow based on the Arduino release notes, which specify 
  # the IDF version used for that release. 
  espressif/arduino-esp32: "==3.3.12"

  # PR-Lib Motor Library
  pr-lib-motor:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/motor

  # PR-Lib version of Adafruit LIS3MDL
  adafruit_lis3mdl:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_lis3mdl

  # PR-Lib version of Adafruit BusIO
  adafruit_busio:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_busio

  # PR-Lib version of Adafruit Unified Sensor
  adafruit_sensor:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_sensor

  # PR-Lib version of PS5-ESP32 library
  ps5-esp32:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/ps5_esp32

  # Serial Sabertooth Motor Driver Library
  usbsabertooth:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/USBSabertooth

  # Motor Autowp_mcp2515 Library 
  autowp_mcp2515: 
    version: '*' 
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/autowp_mcp2515

# Force transitive mdns (pulled in by arduino-esp32 as ^1.11.2) to stay on
# 1.14.1 — 1.15.0 currently fails to compile with this project.
overrides:
  - espressif/mdns:
      with:
        espressif/mdns:
          version: "==1.14.1"
      reason: "1.15.0 fails to compile; arduino allows ^1.11.2 which floats onto it"

