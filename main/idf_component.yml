## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/arduino-esp32: ^3.3.0

  # PR-Lib 
  polarrobotics/pr-lib:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git

  fastled/fastled:
    version: '*'
    git: https://github.com/FastLED/FastLED.git

  # adafruit/adafruit-lis3mdl:
  #   version: "*"
  #   git: "https://github.com/adafruit/Adafruit_LIS3MDL.git"

  bluekitchen/btstack:
    git: https://github.com/bluekitchen/btstack.git
    path: port/esp32/components/btstack
    version: v1.6.2

  cmd_nvs:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/cmd_nvs
    version: 4.2.0
  cmd_system:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/cmd_system
    version: 4.2.0
  ricardoquesada/bluepad32:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/bluepad32
    version: 4.2.0

