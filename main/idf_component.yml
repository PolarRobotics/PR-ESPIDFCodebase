## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/arduino-esp32: ^3.3.0

  # PR-Lib Motor Library
  pr-lib-motor:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/motor

  # PR-Lib version of Adafruit LIS3MDL
  adafruit_lis3mdl:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_lis3mdl

  # PR-Lib version of Adafruit BusIO
  adafruit_busio:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_busio

  # PR-Lib version of Adafruit Unified Sensor
  adafruit_sensor:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/adafruit_sensor

  # PR-Lib version of PS5-ESP32 library
  ps5-esp32:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/ps5_esp32


  usbsabertooth:
    version: '*'
    git: https://github.com/PolarRobotics/PR-Lib.git
    path: components/USBSabertooth