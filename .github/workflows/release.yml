name: Create Release on Push (Robot)

on:
  push:
    branches: [ "production" ]

jobs:
  release:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.5

    steps:
    - uses: actions/checkout@v4

    - name: Cache IDF build
      uses: actions/cache@v4.3.0
      with:
        path: |
          ~/.espressif
          build
        key: ${{ runner.os }}-idf-${{ hashFiles('**/CMakeLists.txt', '**/sdkconfig') }}
        restore-keys: |
          ${{ runner.os }}-idf-

    - name: Set target and build the project
      run: |
        . /opt/esp/idf/export.sh
        # Use the 'robot' preset by default in CI so the correct sdkconfigs/build dir are used
        export IDF_PRESET=robot
        # Configure the project with the CMake preset so the correct SDKCONFIG_DEFAULTS and build dir are used.
        # This ensures CI picks the same preset as VS Code and creates the expected build/robot folder.
        idf.py set-target esp32
        cmake -G Ninja -B build/robot -S . -DSDKCONFIG='build/robot/sdkconfig' -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.defaults.robot'

        
    - name: Generate version from date
      id: version
      run: |
        VERSION=$(date -u "+%Y.%m.%d-%H%M")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: |
          build/robot/bootloader/bootloader.bin
          build/robot/partition_table/partition-table.bin
          build/robot/{{ github.event.repository.name }}.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
